# ================================================================
# PERFIL: prod
# Activar con: SPRING_PROFILES_ACTIVE=prod
#
# REGLA: cero credenciales hardcodeadas aqui.
# Todo valor sensible llega como variable de entorno desde Azure.
# ================================================================

# ── Servidor ───────────────────────────────────────────────────────
server.port=${PORT:8080}

# ── Base de datos — Supabase via Transaction Pooler (puerto 6543) ─
# prepareThreshold=0 es OBLIGATORIO con PgBouncer / Supabase pooler
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP — conservador para Supabase free tier (maximo 60 conns globales)
spring.datasource.hikari.pool-name=InventarioProd-Pool
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
# Keepalive evita que Supabase cierre conexiones inactivas
spring.datasource.hikari.keepalive-time=60000

# ── JPA / Hibernate ───────────────────────────────────────────────
# update: seguro para el primer despliegue; cambiar a validate cuando el schema este estable
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# ── Logging produccion ─────────────────────────────────────────────
logging.level.root=WARN
logging.level.com.costusoft=INFO
logging.level.org.springframework.security=WARN
logging.level.org.springframework.web=WARN
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} %-5level [%thread] %logger{36} - %msg%n

# ── JWT ────────────────────────────────────────────────────────────
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}
app.jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:604800000}

# ── CORS ───────────────────────────────────────────────────────────
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

# ── Email (Resend) ─────────────────────────────────────────────────
app.resend.api-key=${RESEND_API_KEY}
app.email.from=${EMAIL_FROM}
app.frontend.url=${FRONTEND_URL}

# ── Groq IA ────────────────────────────────────────────────────────
groq.api.url=${GROQ_API_URL:https://api.groq.com/openai/v1}
groq.api.key=${GROQ_API_KEY}
groq.api.model=${GROQ_MODEL:llama-3.3-70b-versatile}

# ── Microservicio prediccion ───────────────────────────────────────
prediccion.service.url=${PREDICCION_SERVICE_URL:http://localhost:8001}
prediccion.service.token=${PREDICCION_SERVICE_TOKEN:cambiar-en-produccion}

# ── Microservicio optimizacion ─────────────────────────────────────
optimizacion.service.url=${OPTIMIZACION_SERVICE_URL:http://localhost:8002}
optimizacion.service.token=${OPTIMIZACION_SERVICE_TOKEN:cambiar-en-produccion}
